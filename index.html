<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Spots!!!</title>
  <meta name="description"
    content="Welcome to Spots, an interactive social media web application where users can add and remove photos, like photos of other users, and make a few minor adjustments to their profile.">
  <meta name="keywords" content="social media, photos, interactive, user profiles, likes, spots">
  <meta name="author" content="Badr Labloul">
  <link rel="stylesheet" href="./pages/index.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
  <div class="page">
    <header class="header">
      <img src="./images/logo.svg" alt="Spot logo" class="header__logo">
    </header>
    <main class="content">
      <section class="profile page__section">
        <img src="./images/avatar.jpg" alt="Bessie Coleman" class="profile__avatar">
        <div class="profile__column">
          <h1 class="profile__name">Bessie Coleman</h1>
          <p class="profile__description">Civil Aviator</p>
          <button type="button" class="profile__edit-btn">
            <img src="./images/edit_icon.svg" alt="Edit Icon" class="">Edit Profile
          </button>
        </div>
        <button type="button" class="profile__add-btn">
          <img src="./images/plus_icon.svg" alt="Plus Icon" class="profile__add-icon">New Post
        </button>
      </section>
      <section class="cards page__section">
        <ul class="cards__list">
          <li class="card">
            <img src="./images/1-photo-by-moritz-feldmann-from-pexels.jpg" alt="Val Thorens" class="card__image">
            <div class="card__content">
              <h2 class="card__title">Val Thorens</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
          </li>
          <li class="card">
            <img src="./images/2-photo-by-ceiline-from-pexels.jpg" alt="Restaurant Terrace" class="card__image">
            <div class="card__content">
              <h2 class="card__title">Restaurant Terrace</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
          </li>
          <li class="card">
            <img src="./images/3-photo-by-tubanur-dogan-from-pexels.jpg" alt="An Outdoor Cafe" class="card__image">
            <div class="card__content">
              <h2 class="card__title">An Outdoor Cafe</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
          </li>
          <li class="card">
            <img src="./images/4-photo-by-maurice-laschet-from-pexels.jpg" alt="A very long bridge over the forrest"
              class="card__image">
            <div class="card__content">
              <h2 class="card__title">A very long bridge over the forrest</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
          </li>
          <li class="card">
            <img src="./images/5-photo-by-van-anh-nguyen-from-pexels.jpg" alt="Tunnel with morning light"
              class="card__image">
            <div class="card__content">
              <h2 class="card__title">Tunnel with morning light</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
          </li>
          <li class="card">
            <img src="./images/6-photo-by-moritz-feldmann-from-pexels.jpg" alt="Mountain House" class="card__image">
            <div class="card__content">
              <h2 class="card__title">Mountain House</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
          </li>
        </ul>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__copyright">2026 © Spots</p>
    </footer>

    <div class="modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn">
          <img src="./images/close_icon.svg" alt="Close Icon" class="modal__close-icon">
        </button>
        <h2 class="modal__title">Edit profile</h2>
        <form class="modal__form">
          <label for="profile-name-input" class="modal__label">
            Name
            <input id="profile-name-input" type="text" class="modal__input" placeholder="Type your name"/>
          </label>
          <label for="profile-description-input" class="modal__label">
            Description
            <input id="profile-description-input" type="text" class="modal__input" placeholder="Describe yourself"/>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>

    <div class="modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn">
          <img src="./images/close_icon.svg" alt="Close Icon" class="modal__close-icon">
        </button>
        <h2 class="modal__title">New Post</h2>
        <form class="modal__form">
          <label for="card-image-input" class="modal__label">
            Image link
            <input id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture"/>
          </label>
          <label for="card-description-input" class="modal__label">
            Caption
            <input id="card-description-input" type="text" class="modal__input" placeholder="Type your caption"/>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>

    </div>

  </div>

</body>

</html>
