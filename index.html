<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to Spots!!!</title><meta name="description" content="Welcome to Spots, an interactive social media web application where users can add and remove photos, like photos of other users, and make a few minor adjustments to their profile."><meta name="keywords" content="social media, photos, interactive, user profiles, likes, spots"><meta name="author" content="Badr Labloul"><link rel="icon" href="favicon.ico" type="image/x-icon"><script defer="defer" src="/main.js"></script><link href="/styles.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="./images/logo.svg" alt="Spot logo" class="header__logo"></header><main class="content"><section class="profile page__section"><img src="./images/avatar.jpg" alt="Bessie Coleman" class="profile__avatar"><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img src="./images/edit_icon.svg" alt="Edit Icon" class="">Edit Profile</button></div><button type="button" class="profile__add-btn"><img src="./images/plus_icon.svg" alt="Plus Icon" class="profile__add-icon">New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button class="card__delete-btn" type="button"></button> <img src="#" alt="" class="card__image"><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-btn"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2026 © Spots</p></footer></div><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-btn"><img src="./images/close_icon.svg" alt="Close Icon" class="modal__close-icon"></button><h2 class="modal__title">Edit profile</h2><form id="edit-profile-form" class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-btn"><img src="./images/close_icon.svg" alt="Close Icon" class="modal__close-icon"></button><h2 class="modal__title">New Post</h2><form id="card-form" class="modal__form" novalidate><label for="card-image-input" class="modal__label">Image link <input id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span id="card-image-input-error" class="modal__error"></span></label> <label for="card-description-input" class="modal__label">Caption <input id="card-description-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="card-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__image-container"><button type="button" class="modal__close-btn modal__close-btn_type_preview"></button> <img src="#" alt="" class="modal__image"><p class="modal__caption"></p></div></div></body></html>
